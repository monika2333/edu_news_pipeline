<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻筛选控制台</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/modules/auth.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/modules/duty.css?v={{ version }}">
</head>

<body>
    <div class="duty-shell">
        <header class="duty-header">
            <div>
                <p class="duty-kicker">新闻筛选控制台</p>
                <h1 id="shift-heading">正在加载班次…</h1>
                <p class="duty-coverage" id="shift-coverage"></p>
            </div>
            <div class="duty-header-actions">
                <span class="current-user">{{ current_user.display_name }} · 值班编辑</span>
                <select id="shift-select" aria-label="选择班次"></select>
                <button class="btn btn-secondary" id="btn-duty-refresh">刷新</button>
                <a class="btn btn-secondary" href="/account">修改密码</a>
                <button class="btn btn-secondary" id="btn-logout">退出登录</button>
            </div>
        </header>

        <section class="duty-summary" aria-label="班次统计">
            <div><strong id="duty-stat-total">-</strong><span>班次新闻</span></div>
            <div><strong id="duty-stat-decided">-</strong><span>已决定</span></div>
            <div><strong id="duty-stat-pending">-</strong><span>未处理</span></div>
            <div class="archive-status" id="duty-archive-status">归档状态加载中</div>
        </section>

        <nav class="duty-toolbar">
            <div class="segmented" id="duty-report-types" aria-label="报告类型">
                <button class="is-active" data-report-type="zongbao">综报</button>
                <button data-report-type="wanbao">晚报</button>
            </div>
            <div class="segmented" id="duty-decisions" aria-label="处理状态">
                <button class="is-active" data-decision="pending">待处理</button>
                <button data-decision="selected">采纳</button>
                <button data-decision="backup">备选</button>
                <button data-decision="discarded">放弃</button>
            </div>
            <div class="duty-toolbar-actions">
                <button class="btn btn-secondary" id="btn-duty-save-order" hidden>保存排序</button>
                <button class="btn btn-secondary" id="btn-duty-preview">预览</button>
            </div>
        </nav>

        <p class="duty-warning" id="duty-warning" hidden></p>
        <main class="duty-list" id="duty-list" aria-live="polite"></main>
    </div>

    <dialog class="duty-preview" id="duty-preview-dialog">
        <header>
            <h2>报告草稿</h2>
            <button class="btn btn-secondary" id="btn-duty-close-preview">关闭</button>
        </header>
        <textarea id="duty-preview-text" readonly></textarea>
        <footer>
            <button class="btn btn-secondary" id="btn-duty-download">下载 TXT</button>
            <button class="btn btn-primary" id="btn-duty-copy">复制</button>
        </footer>
    </dialog>

    <div class="toast" id="toast">操作成功</div>
    <script src="/static/js/auth.js?v={{ version }}"></script>
    <script src="/static/js/shift_date.js?v={{ version }}"></script>
    <script src="/static/js/duty.js?v={{ version }}"></script>
</body>

</html>
