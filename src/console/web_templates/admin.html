<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户与排班 · 新闻筛选控制台</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/modules/auth.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/modules/admin.css?v={{ version }}">
</head>

<body>
    <div class="container admin-shell">
        {% set page_eyebrow = "控制台管理" %}
        {% set page_title = "用户与排班" %}
        {% include "_admin_header.html" %}

        <main>
            <p class="admin-alert" id="admin-alert" hidden></p>

            <section class="admin-panel">
                <div class="admin-panel-heading">
                    <h2>轮值模板</h2>
                    <button class="btn btn-primary" id="btn-save-schedule">保存轮值表</button>
                </div>
                <div class="schedule-grid" id="schedule-grid"></div>
            </section>

            <section class="admin-panel">
                <div class="admin-panel-heading">
                    <h2>排班日历</h2>
                    <button class="btn btn-secondary" id="btn-generate-shifts">补齐未来 14 天</button>
                </div>
                <div class="shift-calendar-toolbar">
                    <div class="shift-calendar-navigation" aria-label="切换排班月份">
                        <button class="btn-icon" id="btn-calendar-previous" type="button"
                            aria-label="上个月">‹</button>
                        <h3 id="shift-calendar-month"></h3>
                        <button class="btn-icon" id="btn-calendar-next" type="button"
                            aria-label="下个月">›</button>
                        <button class="btn btn-secondary" id="btn-calendar-today"
                            type="button">今天</button>
                    </div>
                </div>
                <div class="shift-calendar-scroll">
                    <div class="shift-calendar-weekdays" aria-hidden="true">
                        <span>周一</span><span>周二</span><span>周三</span><span>周四</span>
                        <span>周五</span><span>周六</span><span>周日</span>
                    </div>
                    <div class="shift-calendar-grid" id="shift-calendar-grid"
                        aria-label="月度排班日历"></div>
                </div>
            </section>

            <section class="admin-panel">
                <div class="admin-panel-heading">
                    <h2>账号管理</h2>
                </div>
                <div class="admin-user-toolbar">
                    <input id="admin-user-search" type="search"
                        placeholder="搜索姓名或用户名…" aria-label="搜索姓名或用户名">
                    <a class="btn btn-primary admin-create-user-link"
                        href="/admin/users/new">创建账号</a>
                </div>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr><th>姓名</th><th>用户名</th><th>角色</th><th>首选值班日</th><th>状态</th><th>最近登录</th><th>操作</th></tr>
                        </thead>
                        <tbody id="users-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div class="modal" id="delete-user-modal" role="dialog" aria-modal="true"
        aria-labelledby="delete-user-modal-title" aria-hidden="true">
        <form class="modal-content admin-modal-content" id="delete-user-form">
            <div class="modal-header">
                <div>
                    <p class="admin-delete-modal-eyebrow">删除账号</p>
                    <h3 id="delete-user-modal-title">确认删除用户</h3>
                </div>
            </div>
            <div class="modal-body admin-delete-modal-body">
                <p>
                    即将删除
                    <strong id="delete-user-name"></strong>
                    。该用户将无法登录，但历史值班和审阅记录会继续保留。
                </p>
                <label for="delete-user-confirmation">
                    请输入“确认删除”
                    <input id="delete-user-confirmation" type="text" autocomplete="off"
                        spellcheck="false" placeholder="确认删除">
                </label>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btn-cancel-delete-user"
                    type="button">取消</button>
                <button class="btn admin-confirm-delete" id="btn-confirm-delete-user"
                    type="submit" disabled>删除用户</button>
            </div>
        </form>
    </div>

    <div class="modal" id="shift-editor-modal" role="dialog" aria-modal="true"
        aria-labelledby="shift-editor-title" aria-hidden="true">
        <section class="modal-content admin-modal-content">
            <div class="modal-header">
                <div>
                    <p class="admin-header-eyebrow">具体班次</p>
                    <h3 id="shift-editor-title"></h3>
                </div>
                <button class="btn-icon" id="btn-close-shift-editor" type="button"
                    aria-label="关闭班次设置">✕</button>
            </div>
            <div class="modal-body">
                <p class="admin-shift-current" id="shift-editor-current"></p>
                <label class="schedule-day" for="shift-editor-assignee">
                    负责人
                    <select id="shift-editor-assignee">
                        <option value="">请选择负责人</option>
                    </select>
                </label>
                <p class="admin-shift-modal-hint">选择负责人后立即保存；历史班次仅供查看。</p>
            </div>
            <div class="modal-footer admin-shift-modal-actions">
                <button class="btn btn-secondary"
                    id="btn-clear-shift-assignee" type="button">清除当天负责人</button>
                <button class="btn btn-secondary" id="btn-restore-shift-template"
                    type="button">恢复轮值模板</button>
            </div>
        </section>
    </div>

    <div class="toast" id="toast">操作成功</div>
    <script src="/static/js/auth.js?v={{ version }}"></script>
    <script src="/static/js/shift_date.js?v={{ version }}"></script>
    <script src="/static/js/manual_filter/utils.js?v={{ version }}"></script>
    <script src="/static/js/admin.js?v={{ version }}"></script>
</body>

</html>
