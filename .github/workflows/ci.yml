name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 临时起一个 PostgreSQL 容器，测完自动销毁
    # 必须是 17：database/schema.sql 里用到了 transaction_timeout，这是 PG17 才有的参数
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edu_news_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: edu_news_pipeline
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: public
      # 假密钥。测试不会真的调 LLM，只是启动时检查这个变量存在
      LLM_API_KEY: dummy-key-for-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt

      - name: 静态检查
        run: ruff check .

      - name: 建立数据库表结构
        run: psql -v ON_ERROR_STOP=1 -f database/schema.sql
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: edu_news_pipeline

      # 必须写 python -m pytest，不能写裸 pytest。
      # 裸 pytest 不会把当前目录放进 sys.path，63 个测试文件会 import src 失败。
      - name: 运行测试
        run: python -m pytest -q