<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻筛选控制台 · 值班结果筛选</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/modules/auth.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/modules/duty_summary.css?v={{ version }}">
</head>

<body>
    <div class="summary-shell">
        <header class="summary-header">
            <div class="summary-header-left">
                <h1>新闻筛选控制台</h1>
            </div>
            <div class="summary-header-actions">
                <nav class="admin-view-switch" aria-label="管理员主视图">
                    <a class="admin-view-link" href="/manual_filter">全量新闻筛选</a>
                    <a class="admin-view-link is-active" href="/admin/duty-summary" aria-current="page">
                        值班结果筛选
                    </a>
                    <a class="admin-view-link" href="/admin/review">汇总审阅</a>
                </nav>
                <details class="account-menu">
                    <summary class="account-menu-trigger current-user" id="current-user">
                        <span>{{ current_user.display_name }} · 管理员</span>
                    </summary>
                    <div class="account-menu-panel">
                        <a class="account-menu-item" href="/admin">用户与排班</a>
                        <a class="account-menu-item" href="/account">修改密码</a>
                        <button class="account-menu-item" id="btn-logout" type="button">退出登录</button>
                    </div>
                </details>
            </div>
        </header>

        <section class="summary-layout is-shifts-collapsed" id="summary-layout">
            <aside class="summary-shifts" id="summary-shifts-panel" hidden>
                <div class="summary-section-heading">
                    <h2>班次</h2>
                </div>
                <button class="uncovered-button" id="btn-uncovered">无有效班次覆盖</button>
                <div id="summary-shift-list"></div>
            </aside>

            <main class="summary-results">
                <div class="summary-section-heading">
                    <div><p id="summary-context">请选择班次</p><h2 id="summary-title">初审结果</h2></div>
                    <div class="summary-result-tools">
                        <button class="btn btn-secondary summary-shift-toggle" id="btn-toggle-shifts"
                            aria-expanded="false" aria-controls="summary-shifts-panel">
                            查看班次
                        </button>
                        <div class="summary-filters">
                            <select id="summary-decision">
                                <option value="">全部状态</option>
                                <option value="mismatch">与管理员结论不同</option>
                                <option value="pending">尚未处理</option>
                                <option value="selected">建议采纳</option>
                                <option value="backup">建议备选</option>
                                <option value="discarded">建议放弃</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="summary-import-bar" id="summary-import-bar" hidden>
                    <div class="summary-column-tabs" role="tablist" aria-label="管理员工作区栏目">
                        <button class="summary-column-tab is-active" type="button" role="tab"
                            aria-selected="true" data-report-type="zongbao" data-target-status="selected">
                            综报采纳
                        </button>
                        <button class="summary-column-tab" type="button" role="tab"
                            aria-selected="false" data-report-type="zongbao" data-target-status="backup">
                            综报备选
                        </button>
                        <button class="summary-column-tab" type="button" role="tab"
                            aria-selected="false" data-report-type="wanbao" data-target-status="selected">
                            晚报采纳
                        </button>
                        <button class="summary-column-tab" type="button" role="tab"
                            aria-selected="false" data-report-type="wanbao" data-target-status="backup">
                            晚报备选
                        </button>
                    </div>
                    <div class="summary-selection-tools">
                        <input id="summary-search-input" type="search" placeholder="搜索当前栏目…"
                            aria-label="搜索当前栏目">
                        <label class="summary-select-all">
                            <input id="summary-select-all" type="checkbox">
                            <span>全选</span>
                        </label>
                        <span class="summary-selection-count" id="summary-selection-count">已选择 0 条</span>
                        <button class="btn btn-primary" id="btn-import-results">送入汇总审阅</button>
                    </div>
                </div>
                <div class="summary-items" id="summary-items">
                    <div class="summary-empty">从左侧选择一个班次。</div>
                </div>
            </main>
        </section>
    </div>

    <div class="modal" id="summary-import-conflict-modal" role="dialog" aria-modal="true"
        aria-labelledby="summary-import-conflict-title" aria-hidden="true">
        <div class="modal-content summary-conflict-modal-content">
            <div class="modal-header">
                <div>
                    <p class="summary-conflict-progress" id="summary-conflict-progress"></p>
                    <h3 id="summary-import-conflict-title">选择要保留的版本</h3>
                </div>
                <button class="btn btn-secondary" id="btn-close-import-conflict" type="button">取消导入</button>
            </div>
            <div class="modal-body">
                <h4 class="summary-conflict-article-title" id="summary-conflict-article-title"></h4>
                <p class="summary-conflict-instruction">
                    两边的摘要和来源都可以先修改；选择其中一个版本后，另一版不会写入汇总审阅。
                </p>
                <div class="summary-conflict-grid">
                    <section class="summary-conflict-version">
                        <div class="summary-conflict-version-heading">
                            <h4>当前汇总审阅版本</h4>
                            <span id="summary-existing-column"></span>
                        </div>
                        <label>
                            摘要
                            <textarea id="summary-existing-summary"></textarea>
                        </label>
                        <label>
                            来源
                            <input id="summary-existing-source" type="text">
                        </label>
                        <button class="btn btn-primary" id="btn-keep-existing" type="button">
                            保留当前版本
                        </button>
                    </section>
                    <section class="summary-conflict-version">
                        <div class="summary-conflict-version-heading">
                            <h4>本次值班版本</h4>
                            <span id="summary-duty-column"></span>
                        </div>
                        <label>
                            摘要
                            <textarea id="summary-duty-summary"></textarea>
                        </label>
                        <label>
                            来源
                            <input id="summary-duty-source" type="text">
                        </label>
                        <button class="btn btn-primary" id="btn-keep-duty" type="button">
                            采用值班版本
                        </button>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">操作成功</div>
    <script src="/static/js/auth.js?v={{ version }}"></script>
    <script src="/static/js/duty_summary.js?v={{ version }}"></script>
</body>

</html>
