# Ruff 配置。目前只启用「一定是错」的规则，全库为零违规。
# 之所以分层：全库在完整规则集下有约 2770 条提示，其中 2279 条是
# Optional[X] → X | None 这类类型标注现代化，属于风格更新而非缺陷，
# 一次性清理会产生一个几千行的 diff，不利于审阅。

target-version = "py312"
line-length = 120

[lint]
# 第一层：真正的错误。当前全库零违规，可以直接进 CI。
#   E9  语法错误 / IO 错误
#   F63 比较运算用错类型（如 `x is "abc"`）
#   F7  语法层面的逻辑错误（break 在循环外等）
#   F82 未定义名字  ← 2026-09 的 ManualReviewConflictError 缺陷就是这条
#   F811 同名重复定义（后一个静默覆盖前一个）
#   F841 定义了却从未使用的局部变量
select = ["E9", "F63", "F7", "F82", "F811", "F841"]

# 尚未启用的规则与当前违规数（供后续分批清理时参考）：
#   F401  未使用的 import       62 条   可自动修复
#   I001  import 顺序未排序     58 条   可自动修复
#   W605  字符串里的非法转义     1 条   scripts/tools/backfill_ldwb_issue.py:48
#   B     bugbear 常见陷阱     135 条   需逐条判断
#   UP    语法现代化          2294 条   风格更新，建议单独排期