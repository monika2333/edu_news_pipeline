<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>值班结果汇总</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/modules/auth.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/modules/duty_summary.css?v={{ version }}">
</head>

<body>
    <div class="summary-shell">
        <header class="summary-header">
            <div><p>管理员复核</p><h1>值班结果汇总</h1></div>
            <div class="summary-header-actions">
                <span class="current-user">{{ current_user.display_name }} · 管理员</span>
                <a class="btn btn-secondary" href="/admin">用户与排班</a>
                <a class="btn btn-secondary" href="/manual_filter">人工筛选</a>
                <button class="btn btn-secondary" id="btn-logout">退出</button>
            </div>
        </header>

        <section class="summary-layout">
            <aside class="summary-shifts">
                <div class="summary-section-heading">
                    <h2>班次</h2>
                    <button class="btn btn-secondary" id="btn-summary-refresh">刷新</button>
                </div>
                <button class="uncovered-button" id="btn-uncovered">无有效班次覆盖</button>
                <div id="summary-shift-list"></div>
            </aside>

            <main class="summary-results">
                <div class="summary-section-heading">
                    <div><p id="summary-context">请选择班次</p><h2 id="summary-title">初审结果</h2></div>
                    <div class="summary-filters">
                        <select id="summary-decision">
                            <option value="">全部状态</option>
                            <option value="pending">尚未处理</option>
                            <option value="selected">建议采纳</option>
                            <option value="backup">建议备选</option>
                            <option value="discarded">建议放弃</option>
                        </select>
                        <select id="summary-report-type">
                            <option value="">全部报告</option>
                            <option value="zongbao">综报</option>
                            <option value="wanbao">晚报</option>
                        </select>
                    </div>
                </div>
                <div class="summary-import-bar" id="summary-import-bar" hidden>
                    <span id="summary-selection-count">已选择 0 条</span>
                    <select id="summary-import-target">
                        <option value="zongbao:selected">送入综报采纳</option>
                        <option value="zongbao:backup">送入综报备选</option>
                        <option value="wanbao:selected">送入晚报采纳</option>
                        <option value="wanbao:backup">送入晚报备选</option>
                    </select>
                    <button class="btn btn-primary" id="btn-import-results">送入管理员工作区</button>
                </div>
                <div class="summary-items" id="summary-items">
                    <div class="summary-empty">从左侧选择一个班次。</div>
                </div>
            </main>
        </section>
    </div>

    <div class="toast" id="toast">操作成功</div>
    <script src="/static/js/auth.js?v={{ version }}"></script>
    <script src="/static/js/duty_summary.js?v={{ version }}"></script>
</body>

</html>
