<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 · 新闻筛选控制台</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/modules/admin.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/modules/header.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/modules/settings.css?v={{ version }}">
</head>

<body data-current-user-name="{{ current_user.display_name }}">
    <div class="container admin-shell">
        {% set page_eyebrow = "控制台管理" %}
        {% set page_title = "系统设置" %}
        {% set admin_menu_active = "settings" %}
        {% include "_admin_header.html" %}

        <main>
            <p class="admin-alert" id="settings-alert" hidden></p>

            <div class="settings-tabs" role="tablist" aria-label="系统设置分区">
                <button class="settings-tab" id="settings-tab-models" type="button"
                    role="tab" data-settings-tab="models">模型</button>
                <button class="settings-tab" id="settings-tab-sources" type="button"
                    role="tab" data-settings-tab="sources">数据源</button>
                <button class="settings-tab" id="settings-tab-bonuses" type="button"
                    role="tab" data-settings-tab="bonuses">加分词典</button>
                <button class="settings-tab settings-tab-minor" id="settings-tab-advanced"
                    type="button" role="tab" data-settings-tab="advanced">高级</button>
            </div>

            <section class="admin-panel settings-panel" id="settings-panel-models"
                role="tabpanel" aria-labelledby="settings-tab-models"></section>
            <section class="admin-panel settings-panel" id="settings-panel-sources"
                role="tabpanel" aria-labelledby="settings-tab-sources"></section>
            <section class="admin-panel settings-panel" id="settings-panel-bonuses"
                role="tabpanel" aria-labelledby="settings-tab-bonuses"></section>
            <section class="admin-panel settings-panel" id="settings-panel-advanced"
                role="tabpanel" aria-labelledby="settings-tab-advanced"></section>
        </main>
    </div>

    <div class="toast" id="toast">操作成功</div>
    <script src="/static/js/api_error.js?v={{ version }}"></script>
    <script src="/static/js/auth.js?v={{ version }}"></script>
    <script src="/static/js/manual_filter/utils.js?v={{ version }}"></script>
    <script src="/static/js/settings/core.js?v={{ version }}"></script>
    <script src="/static/js/settings/endpoints.js?v={{ version }}"></script>
    <script src="/static/js/settings/models_tab.js?v={{ version }}"></script>
    <script src="/static/js/settings/sources_tab.js?v={{ version }}"></script>
    <script src="/static/js/settings/source_accounts.js?v={{ version }}"></script>
    <script src="/static/js/settings/bonus_tab.js?v={{ version }}"></script>
    <script src="/static/js/settings/advanced_tab.js?v={{ version }}"></script>
    <script src="/static/js/settings/init.js?v={{ version }}"></script>
</body>

</html>
