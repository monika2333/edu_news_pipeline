<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · 教育新闻控制台</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/modules/auth.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/modules/login.css?v={{ version }}">
</head>

<body class="login-page">
    <main class="login-card account-card">
        <div class="account-topbar">
            <a class="auth-back-link" href="/">← 返回工作台</a>
            <button class="btn btn-secondary" id="btn-logout" type="button">退出登录</button>
        </div>

        <div class="login-heading">
            <p class="login-eyebrow">ACCOUNT SECURITY</p>
            <h1>修改登录密码</h1>
            <p>{{ current_user.display_name }} · {{ current_user.username }}</p>
        </div>

        <div class="account-identity">
            <span>当前角色</span>
            <strong>{{ "管理员" if current_user.role == "admin" else "值班编辑" }}</strong>
        </div>

        <form id="change-password-form" class="login-form">
            <input
                name="username"
                type="hidden"
                value="{{ current_user.username }}"
                autocomplete="username"
            >
            <label for="current-password">当前密码</label>
            <input
                id="current-password"
                name="current_password"
                type="password"
                autocomplete="current-password"
                required
            >

            <label for="new-password">新密码</label>
            <input
                id="new-password"
                name="new_password"
                type="password"
                autocomplete="new-password"
                placeholder="请输入新密码"
                required
            >

            <label for="new-password-confirm">确认新密码</label>
            <input
                id="new-password-confirm"
                name="new_password_confirm"
                type="password"
                autocomplete="new-password"
                required
            >

            <p class="field-hint">修改成功后，其他设备上的登录会话将自动退出。</p>
            <p class="login-success" id="password-success" role="status" hidden></p>
            <p class="login-error" id="password-error" role="alert" hidden></p>
            <button class="btn btn-primary login-submit" id="password-submit" type="submit">更新密码</button>
        </form>
    </main>
    <script src="/static/js/api_error.js?v={{ version }}"></script>
    <script src="/static/js/auth.js?v={{ version }}"></script>
    <script src="/static/js/account.js?v={{ version }}"></script>
</body>

</html>
