<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户与排班 · 新闻筛选控制台</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/modules/auth.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/modules/admin.css?v={{ version }}">
</head>

<body>
    <div class="container admin-shell">
        <header>
            <div class="header-left">
                <p class="admin-header-eyebrow">控制台管理</p>
                <h1>用户与排班</h1>
            </div>
            <div class="header-right">
                <nav class="admin-view-switch" aria-label="管理员主视图">
                    <a class="admin-view-link" href="/manual_filter">全量新闻筛选</a>
                    <a class="admin-view-link" href="/admin/duty-summary">值班结果筛选</a>
                    <span class="admin-view-stage-divider" aria-hidden="true"></span>
                    <a class="admin-view-link" href="/admin/review">汇总审阅</a>
                </nav>
                <details class="account-menu">
                    <summary class="account-menu-trigger current-user" id="current-user">
                        <span>{{ current_user.display_name }} · 管理员</span>
                    </summary>
                    <div class="account-menu-panel">
                        <a class="account-menu-item is-active" href="/admin" aria-current="page">用户与排班</a>
                        <a class="account-menu-item" href="/account">修改密码</a>
                        <button class="account-menu-item" id="btn-logout" type="button">退出登录</button>
                    </div>
                </details>
            </div>
        </header>

        <main>
            <p class="admin-alert" id="admin-alert" hidden></p>

            <section class="admin-panel">
                <div class="admin-panel-heading">
                    <div>
                        <p>账号</p>
                        <h2>控制台用户</h2>
                    </div>
                </div>
                <form class="admin-create-user" id="create-user-form">
                    <input name="username" placeholder="用户名" required>
                    <input name="display_name" placeholder="姓名" required>
                    <select name="role">
                        <option value="duty_editor">值班编辑</option>
                        <option value="admin">管理员</option>
                    </select>
                    <select name="preferred_weekday" aria-label="首选值班日">
                        <option value="">首选值班日（可选）</option>
                        <option value="0">周一</option>
                        <option value="1">周二</option>
                        <option value="2">周三</option>
                        <option value="3">周四</option>
                        <option value="4">周五</option>
                        <option value="5">周六</option>
                        <option value="6">周日</option>
                    </select>
                    <input name="password" type="password" minlength="10" placeholder="初始密码（至少 10 位）" required>
                    <button class="btn btn-primary" type="submit">创建账号</button>
                </form>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr><th>姓名</th><th>用户名</th><th>角色</th><th>首选值班日</th><th>状态</th><th>最近登录</th><th>操作</th></tr>
                        </thead>
                        <tbody id="users-body"></tbody>
                    </table>
                </div>
            </section>

            <section class="admin-panel">
                <div class="admin-panel-heading">
                    <div>
                        <p>轮值模板</p>
                        <h2>周一至周日</h2>
                    </div>
                    <button class="btn btn-primary" id="btn-save-schedule">保存轮值表</button>
                </div>
                <div class="schedule-grid" id="schedule-grid"></div>
            </section>

            <section class="admin-panel">
                <div class="admin-panel-heading">
                    <div>
                        <p>具体班次</p>
                        <h2>排班日历</h2>
                    </div>
                    <button class="btn btn-secondary" id="btn-generate-shifts">补齐未来 14 天</button>
                </div>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr><th>覆盖范围</th><th>负责人</th><th>状态</th><th>备注</th><th>操作</th></tr>
                        </thead>
                        <tbody id="shifts-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div class="toast" id="toast">操作成功</div>
    <script src="/static/js/auth.js?v={{ version }}"></script>
    <script src="/static/js/admin.js?v={{ version }}"></script>
</body>

</html>
